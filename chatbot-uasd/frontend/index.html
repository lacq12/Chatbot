<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chatbot UASD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Chatbot UASD 🤖</h1>

  <div id="chat"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Haz una pregunta...">
    <button onclick="sendMessage()">Enviar</button>
  </div>

  <div class="suggestions">
    <h3>Preguntas sugeridas:</h3>
    <button onclick="quickQuestion('¿Qué es la UASD?')">¿Qué es la UASD?</button>
    <button onclick="quickQuestion('¿Cuáles son las funciones de la UASD?')">Funciones</button>
    <button onclick="quickQuestion('¿Qué es el Consejo Universitario?')">Consejo</button>
    <button onclick="quickQuestion('¿Cuáles son los derechos de los estudiantes?')">Derechos</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
